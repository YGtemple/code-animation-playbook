<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>养龙虾</title>
<style>
  /* 三款本地像素字体：英文标题/UI=PressStart2P，正文/HUD/数字=VT323，中文=FusionPixel */
  @font-face { font-family:'PressStart'; src:url('fonts/PressStart2P-Regular.ttf') format('truetype'); font-display:block; }
  @font-face { font-family:'VT323'; src:url('fonts/VT323-Regular.ttf') format('truetype'); font-display:block; }
  @font-face { font-family:'FusionZH'; src:url('fonts/FusionPixelZH.ttf') format('truetype'); font-display:block; }
  html,body { margin:0; padding:0; background:#000; overflow:hidden; }
  #stage { width:1920px; height:1080px; display:block; }
  text { user-select:none; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"
     shape-rendering="crispEdges"
     preserveAspectRatio="xMidYMid meet">
  <!-- 全部内容由 render.js 在加载时一次性建好 -->
</svg>
<script src="timeline.js"></script>
<script src="render.js"></script>

</html>
